name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Auto Accept Android Licenses & Fix Missing Files
        run: |
          # লাইসেন্স স্বয়ংক্রিয়ভাবে গ্রহণ করা
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # প্রজেক্ট ডিরেক্টরি খুঁজে বের করা
          if [ ! -f "build.gradle" ]; then
            SUBDIR=$(dirname $(find . -maxdepth 2 -name "build.gradle" | head -n 1))
            echo "Moving to $SUBDIR"
            cd "$SUBDIR"
          fi

          # AndroidManifest.xml না থাকলে স্বয়ংক্রিয়ভাবে তৈরি করা
          mkdir -p app/src/main
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Brau Mono Keyboard"
                  android:supportsRtl="true">
                  <service
                      android:name=".BrauKeyboardService"
                      android:label="Brau Mono English Keyboard"
                      android:exported="true"
                      android:permission="android.permission.BIND_INPUT_METHOD">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF
          fi

          # method.xml না থাকলে তৈরি করা
          mkdir -p app/src/main/res/xml
          if [ ! -f "app/src/main/res/xml/method.xml" ]; then
            cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android">
              <subtype
                  android:label="English"
                  android:imeSubtypeLocale="en_US"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF
          fi

      - name: Build Debug APK
        run: |
          if [ -f "build.gradle" ]; then
            gradle assembleDebug --stacktrace
          else
            SUBDIR=$(dirname $(find . -maxdepth 2 -name "build.gradle" | head -n 1))
            cd "$SUBDIR"
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrauMonoKeyboard-APK
          path: "**/build/outputs/apk/debug/*.apk"
