name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Prepare Files and Build APK
        run: |
          # যেখানে settings.gradle আছে সেই ফোল্ডার খুঁজে নেওয়া
          TARGET_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle" | head -n 1))
          echo "Building inside: $TARGET_DIR"
          cd "$TARGET_DIR"

          # ফোল্ডার তৈরি
          mkdir -p app/src/main/res/xml

          # AndroidManifest.xml তৈরি (Base64 দিয়ে নিরাপদভাবে)
          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "" | base64 -d > app/src/main/AndroidManifest.xml
          fi

          # method.xml তৈরি
          if [ ! -f "app/src/main/res/xml/method.xml" ]; then
            echo "" | base64 -d > app/src/main/res/xml/method.xml
          fi

          # APK বিল্ড করা
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BrauMonoKeyboard-APK
          path: "**/build/outputs/apk/debug/*.apk"
